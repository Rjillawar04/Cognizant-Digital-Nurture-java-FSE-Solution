<h2>Student Profile</h2>

<hr>

<h3>Enrolled Courses</h3>

@if(enrolledCourses.length > 0){

  <ul>

    @for(course of enrolledCourses; track course.id){

      <li>

        <strong>{{ course.name }}</strong>

        ({{ course.code }}) -

        {{ course.credits }} Credits

      </li>

    }

  </ul>

}

@else{

  <p>No courses enrolled yet.</p>

}
